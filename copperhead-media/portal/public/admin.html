<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>copperhead. — admin</title>
    <link rel="stylesheet" href="https://use.typekit.net/sag3htb.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/portal.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="portal-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar admin-sidebar">
            <h1 class="sidebar-logo">copperhead.</h1>
            <p class="sidebar-label admin-label">Admin Panel</p>

            <nav class="sidebar-nav">
                <a data-view="dashboard" class="active">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    Dashboard
                </a>
                <a data-view="manage-posts">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    Manage Posts
                </a>
                <a data-view="content-calendar">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    Content Calendar
                </a>
                <a data-view="create-post">
                    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Create Post
                </a>
                <a data-view="manage-assets">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    Manage Assets
                </a>
                <a data-view="analytics-input">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    Analytics
                </a>
            </nav>

            <div class="sidebar-bottom">
                <a href="/" class="client-preview-link">
                    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    Client View
                </a>
                <a id="logoutBtn">
                    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Sign Out
                </a>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content" id="mainContent">
            <!-- Views rendered by admin.js -->
        </main>
    </div>

    <!-- EDIT POST MODAL -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-backdrop" id="editModalBackdrop"></div>
        <div class="modal-panel modal-panel-wide" id="editModalPanel">
            <button class="modal-close" id="editModalClose">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <div class="modal-header" id="editModalHeader"></div>
            <div class="modal-body" id="editModalBody"></div>
        </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" multiple accept="image/*,video/*,.pdf,.svg" style="display:none">

    <script src="/js/admin.js"></script>
</body>
</html>
